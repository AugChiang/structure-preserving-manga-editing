# Environment for the FLUX 3 Image Klein (demo_flux3_klein.py) and Qwen-Image
# 2.1 (demo_qwen_image21.py) backends. Both need diffusers >= 0.42, newer than
# the pinned paper environment in requirements.txt, so they live in a separate
# environment. bitsandbytes loads the Qwen-Image 2.1 text encoder in NF4 for
# --low-vram.
#
#   conda env create -f environment.yml     (Miniconda, Windows or Linux)
#   conda activate spme
#
# Targets CUDA 12.8 wheels, which support the RTX 4070 (Ada, sm_89) on
# Windows 11 and Linux. They need an NVIDIA driver R570 or newer.
name: spme
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.1
      - torchvision==0.24.1
      - diffusers==0.42.1
      - transformers==5.22.1
      - accelerate==1.15.0
      - safetensors==0.8.0
      - huggingface-hub==2.4.0
      - gguf==0.19.0
      - bitsandbytes==0.50.2
      - numpy==2.4.6
      - Pillow==13.0.0
      - protobuf==7.36.2
      - sentencepiece==0.2.2
      - tqdm==4.70.1
